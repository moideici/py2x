name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: Tests rapides (conversion + refus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests
      - run: python tests/idioms.py

  compiled-cpp:
    name: Corpus compilé en C++ (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PY2X_COMPILE=cpp python -m unittest discover -s tests
